[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-financial-models"
version = "0.4.0"
description = "Reproducible cash-flow, credit-risk, and portfolio models that complement the Excel workbook."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ParBproject"}]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.8"]
dashboard = ["pandas>=2,<4", "streamlit>=1.45,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
