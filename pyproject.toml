[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-financial-models"
version = "0.6.0"
description = "Tested cash-flow, credit, portfolio, and market-risk models with a dark-theme dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ParBproject"}]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2,<4",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.8"]
dashboard = ["streamlit>=1.45,<2", "plotly>=5.22,<6"]
market-data = ["yfinance>=0.2.54,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
