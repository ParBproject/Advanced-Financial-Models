name: Financial model quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,dashboard]"

      - name: Ruff
        run: ruff check src tests examples dashboard

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile package and dashboard
        run: python -m compileall -q src examples dashboard

      - name: Verify dashboard dependencies
        run: python -c "import pandas, streamlit; import financial_models"
